name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extension-e2e:
    permissions:
      contents: read
    name: Mock extension E2E
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install packaging numpy PySide6==6.11.2

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify Python GUI test runtime
        shell: pwsh
        run: |
          $env:PYTHONPATH = "local-api"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import sys; print(sys.executable); import tray_controller; print('PySide6 tray import OK')"

      - name: Run local-only config tests and mock extension E2E
        shell: pwsh
        run: |
          $env:PYTHON = (Get-Command python).Source
          $env:QT_QPA_PLATFORM = "offscreen"
          npm run test:ci
