name: One-time stale branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale cleanup branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "cleanup/public-boundaries"
            "cleanup/repo-boundaries"
            "cleanup/repo-boundaries-v2"
          )

          for branch in "${branches[@]}"; do
            status="$({
              curl --silent --show-error --location \
                --output /tmp/delete-ref-response \
                --write-out '%{http_code}' \
                --request DELETE \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GH_REPO}/git/refs/heads/${branch}"
            } || true)"

            if [[ "${status}" == "204" ]]; then
              echo "Deleted ${branch}"
            elif [[ "${status}" == "422" || "${status}" == "404" ]]; then
              echo "${branch} is already absent"
            else
              echo "Failed to delete ${branch}: HTTP ${status}" >&2
              cat /tmp/delete-ref-response >&2 || true
              exit 1
            fi
          done
