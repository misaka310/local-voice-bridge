name: Temporary stale branch guard

on:
  push:
    branches:
      - main
  create:

permissions:
  contents: write

jobs:
  delete-current-stale-branch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Delete known stale public-boundary branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="fix/public-repo-boundary-cleanup-20260907"
          status="$({
            curl --silent --show-error --location \
              --output /tmp/delete-ref-response \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPO}/git/refs/heads/${branch}"
          } || true)"
          if [[ "${status}" != "204" && "${status}" != "404" && "${status}" != "422" ]]; then
            cat /tmp/delete-ref-response >&2 || true
            exit 1
          fi

  delete-new-stale-branch:
    if: github.event_name == 'create' && github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'cleanup/') || startsWith(github.event.ref, 'fix/public-repo-boundary-cleanup'))
    runs-on: ubuntu-latest
    steps:
      - name: Delete newly recreated stale branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          status="$({
            curl --silent --show-error --location \
              --output /tmp/delete-ref-response \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPO}/git/refs/heads/${TARGET_BRANCH}"
          } || true)"
          if [[ "${status}" != "204" && "${status}" != "404" && "${status}" != "422" ]]; then
            cat /tmp/delete-ref-response >&2 || true
            exit 1
          fi
