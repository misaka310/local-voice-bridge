name: Delete merged branches

on:
  push:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Delete only merged or fully integrated stale branches
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPO}"
          owner="${GH_REPO%%/*}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          encode() {
            python3 - "$1" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe=''))
          PY
          }

          branches="$(curl -fsSL "${auth[@]}" "${api}/branches?per_page=100")"
          mapfile -t names < <(jq -r '.[].name' <<<"${branches}")

          for branch in "${names[@]}"; do
            [ "${branch}" = "${DEFAULT_BRANCH}" ] && continue
            case "${branch}" in
              codexpro/session/*|security/*|fix/*|chore/*|privacy/*|maintenance/*|dependabot/*) ;;
              *) continue ;;
            esac

            head_query="$(encode "${owner}:${branch}")"
            open_prs="$(curl -fsSL "${auth[@]}" "${api}/pulls?state=open&head=${head_query}&per_page=1")"
            if [ "$(jq 'length' <<<"${open_prs}")" -gt 0 ]; then
              echo "keep ${branch}: open PR"
              continue
            fi

            closed_prs="$(curl -fsSL "${auth[@]}" "${api}/pulls?state=closed&head=${head_query}&per_page=100")"
            merged_count="$(jq '[.[] | select(.merged_at != null)] | length' <<<"${closed_prs}")"

            default_ref="$(encode "${DEFAULT_BRANCH}")"
            branch_ref="$(encode "${branch}")"
            compare_status=0
            compare="$(curl -fsSL "${auth[@]}" "${api}/compare/${default_ref}...${branch_ref}" 2>/dev/null)" || compare_status=$?
            ahead_by=-1
            if [ "${compare_status}" -eq 0 ]; then
              ahead_by="$(jq -r '.ahead_by // -1' <<<"${compare}")"
            fi

            if [ "${merged_count}" -eq 0 ] && [ "${ahead_by}" -ne 0 ]; then
              echo "keep ${branch}: not proven merged"
              continue
            fi

            ref="$(encode "heads/${branch}")"
            status="$(curl -sS -o /tmp/delete-response -w '%{http_code}' -X DELETE "${auth[@]}" "${api}/git/refs/${ref}" || true)"
            if [ "${status}" = "204" ] || [ "${status}" = "404" ]; then
              echo "deleted ${branch}"
            else
              echo "delete failed ${branch}: HTTP ${status}" >&2
              cat /tmp/delete-response >&2 || true
              exit 1
            fi
          done
